name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Versions utilisées par la CI uniquement : le .env de déploiement reste libre.
env:
  PROMETHEUS_VERSION: v3.15.0
  ALERTMANAGER_VERSION: v0.34.1
  BLACKBOX_VERSION: v0.29.0
  GRAFANA_VERSION: 13.2.4
  GO_VERSION: "1.27"
  NODE_EXPORTER_VERSION: v1.12.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Installer les linters
        run: pip install yamllint ansible-lint

      - name: yamllint
        run: yamllint -f github .

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml

      - name: shellcheck
        run: shellcheck -S warning tests/*.sh exporter/*.sh

      - name: promtool check rules
        run: >-
          docker run --rm -v "$PWD/prometheus/rules:/rules:ro" --entrypoint /bin/sh
          "prom/prometheus:$PROMETHEUS_VERSION" -c 'promtool check rules /rules/*.rules.yml'

      - name: ansible-lint
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          cp inventory/hosts.yml.example inventory/hosts.yml
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-lint

  build-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Générer le .env de CI
        run: bash tests/ci-env.sh > ci.env

      - name: Build
        run: docker compose --env-file ci.env build

      - name: Test de fumée
        run: ENV_FILE=ci.env bash tests/smoke.sh

  ansible-deploy:
    needs: lint
    runs-on: ubuntu-latest
    env:
      CI_ENV_FILE: ${{ github.workspace }}/ci.env
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Installer Ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Générer le .env de CI
        run: bash ../tests/ci-env.sh > "$CI_ENV_FILE"

      # Le rôle docker n'est pas joué : Docker est déjà installé sur le runner.
      - name: Déploiement
        run: ansible-playbook -i ../tests/ansible/hosts.yml playbooks/monitoring.yml playbooks/node_exporter.yml

      - name: Idempotence
        run: |
          ansible-playbook -i ../tests/ansible/hosts.yml playbooks/monitoring.yml playbooks/node_exporter.yml | tee run.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' run.log
