services:
  # Image builder (envsubst, bcrypt-tool), copiée dans prometheus et alertmanager (jamais lancée)
  tools:
    build:
      context: ./docker/tools
      args:
        GO_VERSION: ${GO_VERSION:?à définir dans .env}
        ENVSUBST_VERSION: ${ENVSUBST_VERSION:?à définir dans .env}
        BCRYPT_TOOL_VERSION: ${BCRYPT_TOOL_VERSION:?à définir dans .env}
    scale: 0

  prometheus:
    build:
      context: ./docker/prometheus
      additional_contexts:
        tools: service:tools
      args:
        PROMETHEUS_VERSION: ${PROMETHEUS_VERSION:?à définir dans .env}
    environment:
      PROMETHEUS_BASIC_AUTH_USERNAME: ${PROMETHEUS_BASIC_AUTH_USERNAME:?à définir dans .env}
      PROMETHEUS_BASIC_AUTH_PASSWORD: ${PROMETHEUS_BASIC_AUTH_PASSWORD:?à définir dans .env}
      NODE_BASIC_AUTH_USERNAME: ${NODE_BASIC_AUTH_USERNAME:?à définir dans .env}
      NODE_BASIC_AUTH_PASSWORD: ${NODE_BASIC_AUTH_PASSWORD:?à définir dans .env}
      MYSQL_BASIC_AUTH_USERNAME: ${MYSQL_BASIC_AUTH_USERNAME:?à définir dans .env}
      MYSQL_BASIC_AUTH_PASSWORD: ${MYSQL_BASIC_AUTH_PASSWORD:?à définir dans .env}
      NGINX_BASIC_AUTH_USERNAME: ${NGINX_BASIC_AUTH_USERNAME:?à définir dans .env}
      NGINX_BASIC_AUTH_PASSWORD: ${NGINX_BASIC_AUTH_PASSWORD:?à définir dans .env}
      APACHE_BASIC_AUTH_USERNAME: ${APACHE_BASIC_AUTH_USERNAME:?à définir dans .env}
      APACHE_BASIC_AUTH_PASSWORD: ${APACHE_BASIC_AUTH_PASSWORD:?à définir dans .env}
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      # Prometheus est protégé par basic auth : le healthcheck s'authentifie aussi
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          --header "Authorization: Basic $$(printf '%s:%s' "$$PROMETHEUS_BASIC_AUTH_USERNAME" "$$PROMETHEUS_BASIC_AUTH_PASSWORD" | base64 | tr -d '\n')"
          http://localhost:9090/-/ready
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./prometheus/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./prometheus/web.yml.tmpl:/etc/prometheus/web.yml.tmpl:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prom_data:/prometheus

  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION:?à définir dans .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml

  alertmanager:
    build:
      context: ./docker/alertmanager
      additional_contexts:
        tools: service:tools
      args:
        ALERTMANAGER_VERSION: ${ALERTMANAGER_VERSION:?à définir dans .env}
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?à définir dans .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    volumes:
      - ./alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:?à définir dans .env}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?à définir dans .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?à définir dans .env}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:?à définir dans .env}
      # Identifiants de la datasource Prometheus (grafana/provisioning/datasources)
      PROMETHEUS_BASIC_AUTH_USERNAME: ${PROMETHEUS_BASIC_AUTH_USERNAME:?à définir dans .env}
      PROMETHEUS_BASIC_AUTH_PASSWORD: ${PROMETHEUS_BASIC_AUTH_PASSWORD:?à définir dans .env}
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - graf_data:/var/lib/grafana

volumes:
  prom_data:
  graf_data:
