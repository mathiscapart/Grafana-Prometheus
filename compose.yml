services:
  # Image builder d'envsubst, copiée dans prometheus et alertmanager (jamais lancée)
  envsubst:
    build:
      context: ./docker/envsubst
      args:
        GO_VERSION: ${GO_VERSION:?à définir dans .env}
        ENVSUBST_VERSION: ${ENVSUBST_VERSION:?à définir dans .env}
    profiles: [build]

  prometheus:
    build:
      context: ./docker/prometheus
      additional_contexts:
        envsubst: service:envsubst
      args:
        PROMETHEUS_VERSION: ${PROMETHEUS_VERSION:?à définir dans .env}
    environment:
      EXPORTER_BASIC_AUTH_USERNAME: ${EXPORTER_BASIC_AUTH_USERNAME:?à définir dans .env}
      EXPORTER_BASIC_AUTH_PASSWORD: ${EXPORTER_BASIC_AUTH_PASSWORD:?à définir dans .env}
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./prometheus/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prom_data:/prometheus

  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION:?à définir dans .env}
    ports:
      - "9115:9115"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml

  alertmanager:
    build:
      context: ./docker/alertmanager
      additional_contexts:
        envsubst: service:envsubst
      args:
        ALERTMANAGER_VERSION: ${ALERTMANAGER_VERSION:?à définir dans .env}
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?à définir dans .env}
    ports:
      - "9093:9093"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    volumes:
      - ./alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro

  grafana:
    build:
      context: ./grafana
      dockerfile: ../docker/grafana/Dockerfile
      args:
        GRAFANA_VERSION: ${GRAFANA_VERSION:?à définir dans .env}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?à définir dans .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?à définir dans .env}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:?à définir dans .env}
    volumes:
      - graf_data:/var/lib/grafana

volumes:
  prom_data:
  graf_data:
