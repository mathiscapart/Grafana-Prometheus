# Surcharge des valeurs par défaut de Grafana (defaults.ini).
# Les secrets et l'URL publique viennent du .env via les variables GF_* de compose.yml.

[analytics]
reporting_enabled = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[security]
disable_gravatar = true
cookie_samesite = strict

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/Infrastructure/1860.json
