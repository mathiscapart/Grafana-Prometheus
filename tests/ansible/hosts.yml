# Inventaire de test CI : déploie les rôles sur la machine locale (runner).
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    monitoring:
      hosts:
        localhost:
      vars:
        monitoring_env_file: "{{ lookup('env', 'CI_ENV_FILE') }}"
        monitoring_prometheus_targets:
          node:
            - localhost:9100
          blackbox:
            - https://example.com/
    node_exporter:
      hosts:
        localhost:
      vars:
        node_exporter_version: "{{ lookup('env', 'NODE_EXPORTER_VERSION') }}"
